name: Hermes Add-on Static Validation
on:
  push:
    paths:
      - 'family_ops_hermes/**'
      - '.github/workflows/hermes-static-ci.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python and shell syntax
        run: |
          python -m py_compile family_ops_hermes/ha-telegram-bridge.py
          python -m py_compile family_ops_hermes/codex-direct-check.py
          python -m py_compile family_ops_hermes/codex-model-discovery-v5.py
          bash -n family_ops_hermes/run.sh family_ops_hermes/addon-run.sh
      - name: Check add-on configuration and Docker packaging
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import pathlib,yaml
          root = pathlib.Path('family_ops_hermes')
          cfg = yaml.safe_load((root/'config.yaml').read_text())
          assert cfg['version'] == '2026.5.7-29'
          assert cfg['homeassistant_api'] is True
          assert cfg['options']['ha_telegram_bridge'] is False
          assert cfg['options']['model_name'] == 'gpt-6.1-sol'
          assert 'ha_telegram_bridge' in cfg['schema']
          dockerfile=(root/'Dockerfile').read_text()
          assert 'COPY ha-telegram-bridge.py /ha-telegram-bridge.py' in dockerfile
          assert 'HA_TELEGRAM_BRIDGE' in (root/'run.sh').read_text()
          assert 'ha-telegram-bridge.py' in (root/'addon-run.sh').read_text()
          print('Validated v29 syntax, opt-in defaults, permissions and script packaging')
          PY
